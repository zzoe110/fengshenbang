<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情页已迁移……</title>
  <!-- 旧动态详情页：内容已由 build.js 生成的静态页 /blog/<id>.html 承载。
       本页仅做跳转，消除重复内容并回收旧链接权重；canonical 指向列表页兜底。 -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://www.fsbtop.top/blog.html">
  <script>
    (function () {
      var id = new URLSearchParams(window.location.search).get('id');
      if (id && /^[A-Za-z0-9_-]+$/.test(id)) {
        window.location.replace('/blog/' + encodeURIComponent(id) + '.html');
      } else {
        window.location.replace('/blog.html');
      }
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin-top:40vh;">
    正在跳转到文章页…… 若未自动跳转，请<a href="/blog.html">返回博客列表</a>。
  </p>
</body>
</html>
