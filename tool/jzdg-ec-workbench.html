<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>京州口腔·电商部门工作台</title>
<link rel="icon" type="image/png" href="./logo.png">
<!-- 本工作台通过 Supabase BaaS 搭建与存储 -->
<style>
:root{
  --brand:#C41E2A;       /* 京州红 - 更沉稳的专业红 */
  --brand-dark:#9A1820;
  --brand-light:#FDF2F3;
  --brand-subtle:#FEF8F8;
  --bg:#F8F9FA;          /* 更柔和的灰背景 */
  --card:#FFFFFF;
  --ink:#111827;         /* 更深的文字色 */
  --ink-2:#374151;
  --ink-3:#6B7280;
  --ink-4:#9CA3AF;
  --line:#E5E7EB;
  --line-light:#F3F4F6;
  --green:#059669;       /* 更专业的绿 */
  --green-light:#ECFDF5;
  --orange:#D97706;
  --orange-light:#FFFBEB;
  --red:#DC2626;
  --red-light:#FEF2F2;
  --blue:#2563EB;
  --blue-light:#EFF6FF;
  --purple:#7C3AED;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.06),0 10px 24px rgba(0,0,0,.08);
  --r:12px;
  --r-lg:16px;
  --transition:all .2s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:0;background:transparent;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:var(--brand);text-decoration:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#9ca3af;}

/* 动画定义 */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes checkPop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ============ 登录页 ============ */
#loginGate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#C41E2A 0%,#8B1520 100%);padding:20px;z-index:200;}
#loginGate::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none;}
.login-card{background:#fff;border-radius:20px;padding:40px 32px;width:100%;max-width:400px;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);animation:fadeIn .4s ease;position:relative;z-index:1;}
.login-logo{display:flex;justify-content:center;margin-bottom:24px;}
.login-logo img{height:64px;width:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.1));}
.login-title{text-align:center;font-size:22px;font-weight:700;color:var(--ink);margin:0 0 6px;letter-spacing:-.3px;}
.login-sub{text-align:center;font-size:12px;color:var(--ink-4);margin:0 0 28px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;font-weight:500;}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;outline:none;transition:var(--transition);background:var(--bg);}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(196,30,42,.1);background:#fff;}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);color:#fff;padding:13px;border-radius:10px;font-weight:600;font-size:15px;transition:var(--transition);box-shadow:0 4px 12px rgba(196,30,42,.25);margin-top:4px;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(196,30,42,.35);}
.btn-primary:active{transform:translateY(0);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.login-hint{text-align:center;font-size:11px;color:var(--ink-4);margin-top:20px;line-height:1.7;padding:12px;background:var(--bg);border-radius:8px;}
.login-err{color:var(--red);font-size:13px;text-align:center;min-height:20px;margin-top:10px;font-weight:500;}

/* ============ App 骨架 ============ */
#app{display:none;}
#app.show{display:block;animation:fadeIn .3s ease;}
.topbar{position:sticky;top:0;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);color:#fff;display:flex;align-items:center;padding:0 24px;height:64px;box-shadow:0 2px 12px rgba(196,30,42,.2);z-index:50;}
.topbar-logo{height:34px;width:auto;filter:brightness(0) invert(1);drop-shadow:0 1px 2px rgba(0,0,0,.1);}
.topbar-title{margin-left:16px;font-weight:600;font-size:16px;letter-spacing:.3px;}
.topbar-spacer{flex:1;}
.topbar-user{display:flex;align-items:center;gap:12px;font-size:13px;}
.topbar-user .name-text{font-weight:500;}
.topbar-user .badge{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;backdrop-filter:blur(4px);}
.topbar-user .badge.admin{background:#FBBF24;color:#7c2d12;}
.btn-ghost{color:#fff;background:rgba(255,255,255,.15);padding:7px 14px;border-radius:8px;font-size:13px;transition:var(--transition);font-weight:500;}
.btn-ghost:hover{background:rgba(255,255,255,.25);transform:translateY(-1px);}
.btn-ghost:active{transform:translateY(0);}

.topbar-sync{display:flex;align-items:center;gap:8px;margin-right:8px;}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.9);background:rgba(255,255,255,.12);padding:5px 10px;border-radius:20px;white-space:nowrap;backdrop-filter:blur(4px);}
.sync .dot{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 0 2px rgba(52,211,153,.3);animation:pulse 2s infinite;}
.sync.syncing .dot{background:#fbbf24;animation:pulse 1s infinite;}
.sync.err .dot{background:#f87171;animation:none;}
.sync.offline .dot{background:#9ca3af;animation:none;box-shadow:none;}
.btn-ghost.sync-btn{padding:6px 12px;font-size:12px;border-radius:8px;background:rgba(255,255,255,.12);}
.btn-ghost.sync-btn:hover{background:rgba(255,255,255,.22);}

/* ============ 仪表盘容器 ============ */
.dash{max-width:1140px;margin:0 auto;padding:24px 28px 110px;}
.section{scroll-margin-top:76px;margin-bottom:28px;animation:fadeIn .4s ease both;}
.section:nth-child(2){animation-delay:.05s;}
.section:nth-child(3){animation-delay:.1s;}
.section:nth-child(4){animation-delay:.15s;}
.section:nth-child(5){animation-delay:.2s;}
.section:nth-child(6){animation-delay:.25s;}

/* ============ 今日处理 Hero + 统计卡 ============ */
.hero{background:linear-gradient(135deg,#ffffff 0%,var(--brand-subtle) 50%,var(--brand-light) 100%);border-radius:var(--r-lg);padding:24px 28px;margin-bottom:24px;border:1px solid rgba(196,30,42,.08);box-shadow:var(--shadow-md);position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand) 0%,var(--orange) 50%,var(--brand) 100%);background-size:200% 100%;animation:slideIn 1s ease;}
.hero-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px;}
.hero h2{margin:0;font-size:22px;color:var(--ink);display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:-.3px;}
.hero h2::before{content:'📅';font-size:20px;}
.hero .sub{font-size:13px;color:var(--ink-3);font-weight:400;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 6px;}
@media(max-width:768px){.stat-grid{grid-template-columns:repeat(2,1fr);gap:10px;}}
.stat-card{background:#fff;border-radius:14px;padding:16px 18px;border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:var(--transition);position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-color,var(--brand));opacity:.8;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:transparent;}
.stat-card .stat-num{font-size:28px;font-weight:800;color:var(--ink);line-height:1.1;letter-spacing:-.5px;}
.stat-card .stat-num.red{color:var(--red);}
.stat-card .stat-num.brand{color:var(--brand);}
.stat-card .stat-num.blue{color:var(--blue);}
.stat-card .stat-num.orange{color:var(--orange);}
.stat-card .stat-label{font-size:12px;color:var(--ink-3);margin-top:6px;font-weight:500;}
.stat-card.accent-red{--accent-color:var(--red);}
.stat-card.accent-brand{--accent-color:var(--brand);}
.stat-card.accent-blue{--accent-color:var(--blue);}
.stat-card.accent-orange{--accent-color:var(--orange);}

/* ============ 模块卡片 / 版块头 ============ */
.module-card{background:var(--card);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow);border:1px solid var(--line-light);transition:var(--transition);}
.module-card:hover{box-shadow:var(--shadow-md);border-color:var(--line);}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px;padding-bottom:12px;border-bottom:2px solid var(--line-light);}
.section-head h2{margin:0;font-size:17px;color:var(--ink);display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.2px;}
.section-head h2::before{content:'';width:4px;height:20px;background:linear-gradient(180deg,var(--brand) 0%,var(--brand-dark) 100%);border-radius:2px;flex-shrink:0;}
.section-head .count{font-size:11px;color:var(--ink-3);background:var(--bg);padding:3px 10px;border-radius:12px;font-weight:600;margin-left:8px;border:1px solid var(--line);}
.btn-add{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);color:#fff;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:var(--transition);box-shadow:0 2px 8px rgba(196,30,42,.2);white-space:nowrap;}
.btn-add:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(196,30,42,.3);}
.btn-add:active{transform:translateY(0);}

/* ============ 今日要处理 列表 ============ */
.today-list{display:flex;flex-direction:column;gap:10px;}
.today-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-radius:12px;border:1.5px solid var(--line);transition:var(--transition);cursor:pointer;}
.today-item:hover{border-color:var(--brand);box-shadow:0 2px 8px rgba(196,30,42,.08);transform:translateX(2px);}
.today-item.overdue{border-color:var(--red);background:var(--red-light);}
.today-item.overdue:hover{border-color:var(--red);box-shadow:0 2px 8px rgba(220,38,38,.12);}
.today-item .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);flex-shrink:0;box-shadow:0 0 0 3px rgba(196,30,42,.15);}
.today-item.overdue .dot{background:linear-gradient(135deg,var(--red) 0%,#B91C1C 100%);box-shadow:0 0 0 3px rgba(220,38,38,.15);}
.today-item .title{flex:1;font-size:14px;color:var(--ink);font-weight:500;min-width:0;}
.today-item .tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--brand-light);color:var(--brand);font-weight:600;flex-shrink:0;}
.today-item .time{font-size:12px;color:var(--ink-3);flex-shrink:0;font-weight:500;}
@keyframes flashRow{0%,100%{box-shadow:none;}25%,60%{box-shadow:0 0 0 3px rgba(196,30,42,.35);}}
.today-item.flash,.row.flash{animation:flashRow 1.8s ease 2;}

/* ============ 连接（链接）板块 ============ */
.links-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:768px){.links-grid{grid-template-columns:1fr;}.link-list{grid-template-columns:1fr;}}
.link-card{background:var(--card);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line-light);transition:var(--transition);}
.link-card:hover{box-shadow:var(--shadow-md);border-color:var(--line);}
.link-card h3{margin:0 0 14px;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:10px;font-weight:600;}
.link-card h3 .badge-c{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);color:#fff;font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;letter-spacing:.3px;}
.link-card h3 .badge-u{background:linear-gradient(135deg,#374151 0%,#1F2937 100%);color:#fff;font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;letter-spacing:.3px;}
.link-list{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;}
.link-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;position:relative;transition:var(--transition);}
.link-row:hover{background:var(--brand-subtle);border-radius:10px;}
.link-row .cat{font-size:10px;color:var(--ink-2);background:var(--bg);padding:3px 8px;border-radius:6px;flex-shrink:0;font-weight:600;line-height:1.4;border:1px solid var(--line);}
.link-row .anchor{flex:1;font-size:13px;color:var(--ink);text-decoration:none;border-bottom:1.5px dashed transparent;transition:var(--transition);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.link-row .anchor:hover{color:var(--brand);border-bottom-color:var(--brand);}
.link-row .ops{display:none;gap:4px;flex-shrink:0;}
.link-row:hover .ops{display:flex;}
.link-row .ops button{width:24px;height:24px;border-radius:6px;background:var(--bg);font-size:12px;color:var(--ink-3);transition:var(--transition);display:flex;align-items:center;justify-content:center;}
.link-row .ops button:hover{background:var(--brand);color:#fff;}
.link-add-row{display:flex;align-items:center;gap:10px;padding:10px 12px;color:var(--ink-3);cursor:pointer;border-radius:10px;border:1.5px dashed var(--line);font-size:13px;margin-top:6px;transition:var(--transition);grid-column:1/-1;font-weight:500;}
.link-add-row:hover{color:var(--brand);border-color:var(--brand);background:var(--brand-subtle);}

/* ============ 行（待办/会议） ============ */
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;transition:var(--transition);position:relative;}
.row:hover{border-color:#d1d5db;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.row.done{opacity:.6;background:var(--bg);border-color:var(--line);}
.row.doing{border-left:4px solid var(--orange);background:var(--orange-light);border-color:transparent;}
.row .check{width:22px;height:22px;border:2px solid var(--ink-3);border-radius:7px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:var(--transition);background:#fff;}
.row.done .check{background:var(--green);border-color:var(--green);color:#fff;animation:checkPop .2s ease;}
.row .check:hover{border-color:var(--brand);background:var(--brand-light);}
.row .body{flex:1;min-width:0;}
.row .title{font-size:14px;color:var(--ink);font-weight:600;line-height:1.4;}
.row.done .title{text-decoration:line-through;color:var(--ink-3);}
.row .meta{font-size:12px;color:var(--ink-3);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;}
.row .meta .pill{background:var(--bg);padding:2px 8px;border-radius:6px;font-weight:500;border:1px solid var(--line);}
.row .meta .pill.p0{background:#FEE2E2;color:#991B1B;font-weight:600;border-color:#FECACA;}
.row .meta .pill.p1{background:#FEF3C7;color:#92400E;font-weight:600;border-color:#FDE68A;}
.row .meta .pill.p2{background:#DBEAFE;color:#1E40AF;font-weight:500;border-color:#BFDBFE;}
.row .meta .pill.overdue{background:var(--red);color:#fff;border-color:var(--red);}
.row .meta .pill.soon{background:var(--orange);color:#fff;border-color:var(--orange);}
.row .ops{display:flex;gap:6px;flex-shrink:0;opacity:0;transition:var(--transition);}
.row:hover .ops{opacity:1;}
.row .ops button{font-size:12px;padding:5px 10px;border-radius:7px;color:var(--ink-3);background:var(--bg);border:1px solid var(--line);transition:var(--transition);font-weight:500;}
.row .ops button:hover{background:var(--brand-light);color:var(--brand-dark);border-color:var(--brand-light);}
.row .ops button.del:hover{background:#FEE2E2;color:var(--red);border-color:#FECACA;}

/* ============ 表单弹窗 ============ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal.show{display:flex;animation:fadeIn .2s ease;}
.modal-box{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);animation:slideIn .3s ease;}
.modal-box h3{margin:0 0 20px;font-size:18px;color:var(--ink);font-weight:700;letter-spacing:-.3px;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;font-weight:600;}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;outline:none;transition:var(--transition);background:var(--bg);}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(196,30,42,.08);background:#fff;}
.form-row textarea{resize:vertical;min-height:70px;}
.modal-ops{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line-light);}
.modal-ops button{padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;transition:var(--transition);}
.btn-cancel{background:var(--bg);color:var(--ink-2);border:1.5px solid var(--line);}
.btn-cancel:hover{background:#fff;border-color:var(--ink-3);}
.btn-save{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);color:#fff;border:none;box-shadow:0 2px 8px rgba(196,30,42,.2);}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(196,30,42,.3);}

/* ============ 用户后台 ============ */
.user-list{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line-light);}
.user-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-light);transition:var(--transition);}
.user-row:last-child{border-bottom:0;}
.user-row:hover{background:var(--brand-subtle);}
.user-row .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;box-shadow:0 2px 8px rgba(196,30,42,.2);}
.user-row .body{flex:1;}
.user-row .uname{font-weight:600;color:var(--ink);font-size:14px;}
.user-row .urole{font-size:12px;color:var(--ink-3);margin-top:2px;}
.user-row .urole .tag{background:var(--bg);color:var(--ink-2);font-size:10px;padding:2px 8px;border-radius:6px;margin-left:6px;font-weight:600;border:1px solid var(--line);}
.user-row .urole .tag.admin{background:#FEF3C7;color:#92400E;border-color:#FDE68A;}
.user-row .urole .tag.operator{background:#FEF3C7;color:#92400E;border-color:#FDE68A;}
.user-row .urole .tag.service{background:#DBEAFE;color:#1E40AF;border-color:#BFDBFE;}
.user-row .ops{display:flex;gap:6px;}
.user-row .ops button{font-size:12px;padding:6px 12px;border-radius:7px;background:var(--bg);color:var(--ink-3);border:1px solid var(--line);transition:var(--transition);font-weight:500;}
.user-row .ops button:hover{background:var(--brand-light);color:var(--brand-dark);border-color:var(--brand-light);}
.user-row .ops button.del:hover{background:#FEE2E2;color:var(--red);border-color:#FECACA;}

/* ============ 个人中心 ============ */
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:768px){.profile-grid{grid-template-columns:1fr;}}

async function hashPwd(p){const d=new TextEncoder().encode(SALT+p);const b=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function playDing(testOnly){
  try{
    const n=testOnly?1:3; // 测试只响1声；到点提醒连响3声，避免短促漏听
    _playBeeps(n);

function _playBeeps(n){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const gap=0.75; // 两次"叮"之间的间隔（秒）
    for(let i=0;i<n;i++){
      const start=ctx.currentTime+i*gap;
      const o=ctx.createOscillator();const g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';
      o.frequency.setValueAtTime(880,start);
      o.frequency.exponentialRampToValueAtTime(1320,start+0.08);
      g.gain.setValueAtTime(0.001,start);
      g.gain.exponentialRampToValueAtTime(0.25,start+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,start+0.55);
      o.start(start);o.stop(start+0.6);
    }
  }catch(e){}
}

  let q='', body=undefined;

  const diff=new Date(s).getTime()-Date.now();
  const past=diff<0;
  const m=Math.round(Math.abs(diff)/60000);
  if(m<1) return '刚刚';
  if(m<60) return past?`${m}分钟前`:`${m}分钟后`;
  const h=Math.round(m/60);
  if(h<24) return past?`${h}小时前`:`${h}小时后`;
  const d=Math.round(h/24);
  if(d<30) return past?`${d}天前`:`${d}天后`;
  return fmtDate(s);
}

const state={users:[],todos:[],meetings:[],commonLinks:[],userLinks:[],roleTasks:[],currentUser:null,reminderTimer:null,myChecks:{},empChecks:{},checksCloud:false};

// ============ 数据加载 ============
async function loadAll(){
  const [u,t,m,cl,ul,rt]=await Promise.all([
    req('GET','users','select=*'),
    req('GET','todos','select=*&order=created_at.desc'),
    req('GET','meetings','select=*&order=start_at.asc'),
    req('GET','common_links','select=*&order=sort.asc'),
    req('GET','user_links','select=*&order=sort.asc'),
    req('GET','role_tasks','select=*&order=sort.asc')
  ]);
  state.users=u;state.todos=t;state.meetings=m;state.commonLinks=cl;state.userLinks=ul;state.roleTasks=rt;
  // 任务勾选状态：云端优先（每人独立），表不存在/失败时降级本地（按用户+日期隔离）
  try{
    const ck=await req('GET','role_task_checks',`check_date=eq.${getTodayKey()}&select=user_id,task_id`);
    state.myChecks={};state.empChecks={};
    ck.forEach(r=>{
      if(r.user_id===state.currentUser.id) state.myChecks[r.task_id]=true;
      state.empChecks[r.user_id]=state.empChecks[r.user_id]||{};
      state.empChecks[r.user_id][r.task_id]=true;
    });
    state.checksCloud=true;
  }catch(e){
    state.checksCloud=false;
    state.myChecks=loadLocalChecks();
    state.empChecks={};
  }
}

async function doLogin(){
  const username=document.getElementById('loginUser').value.trim();
  const pwd=document.getElementById('loginPwd').value;
  if(!username||!pwd){document.getElementById('loginErr').textContent='请输入用户名和密码';return;}
  document.getElementById('btnLogin').disabled=true;
  document.getElementById('loginErr').textContent='登录中...';
  try{
    const u=await req('GET','users',`username=eq.${encodeURIComponent(username)}&select=*`);
    if(!u.length){document.getElementById('loginErr').textContent='用户不存在';return;}
    const hash=await hashPwd(pwd);
    if(hash!==u[0].pass_hash){document.getElementById('loginErr').textContent='密码错误';return;}
    state.currentUser=u[0];
    localStorage.setItem('jzqg_ec_user',JSON.stringify({id:u[0].id,username:u[0].username,role:u[0].role,display_name:u[0].display_name}));
    document.getElementById('loginGate').style.display='none';
    document.getElementById('app').classList.add('show');
    await loadAll();
    renderAll();
    startReminder();
    setSync('ok');
    startAutoSync();
    requestNotifyPerm(true);
  }catch(e){document.getElementById('loginErr').textContent='登录失败：'+e.message;}
  finally{document.getElementById('btnLogin').disabled=false;}
}
function doLogout(){

  localStorage.removeItem('jzqg_ec_user');
  if(state.reminderTimer) clearInterval(state.reminderTimer);
  if(_autoSyncTimer) clearInterval(_autoSyncTimer);

  document.getElementById('app').classList.remove('show');
  document.getElementById('loginGate').style.display='flex';
  document.getElementById('loginPwd').value='';
  document.getElementById('loginErr').textContent='';
}
async function autoLogin(){

  try{

function renderToday(){
  const me=state.currentUser;
  const today=new Date();today.setHours(0,0,0,0);
  const tomorrow=new Date(today);tomorrow.setDate(tomorrow.getDate()+1);
  // —— 统计卡 ——
  const myActive=state.todos.filter(t=>t.user_id===me.id && t.status!=='done');
  const dueToday=myActive.filter(t=>t.due_at&&(()=>{const d=new Date(t.due_at);return d>=today&&d<tomorrow;})());
  const overdue=myActive.filter(t=>t.due_at&&new Date(t.due_at)<today);
  const myMeetingsToday=state.meetings.filter(m=>m.user_id===me.id&&m.start_at&&(()=>{const d=new Date(m.start_at);return d>=today&&d<tomorrow;})());
  const stats=[
    {num:dueToday.length,label:'今日待办',cls:'brand',accent:'accent-brand'},
    {num:myMeetingsToday.length,label:'今日会议',cls:'blue',accent:'accent-blue'},
    {num:overdue.length,label:'逾期事项',cls:overdue.length?'red':'',accent:'accent-red'},
    {num:myActive.length,label:'待办总数',cls:'',accent:'accent-orange'}
  ];
  document.getElementById('statGrid').innerHTML=stats.map(s=>`
    <div class="stat-card ${s.accent}">
      <div class="stat-num ${s.cls}">${s.num}</div>
      <div class="stat-label">${s.label}</div>
    </div>`).join('');

  // —— 今日要处理清单 ——
  const items=[];
  myActive.forEach(t=>{
    const due=new Date(t.due_at);
    items.push({type:'todo',id:t.id,title:t.title,time:fmtDT(t.due_at),sort:due.getTime(),overdue:due<today,soon:due>=today&&due<tomorrow});
  });
  state.meetings.filter(m=>m.user_id===me.id &&m.start_at).forEach(m=>{
    const due=new Date(m.start_at);
    if(due<new Date(Date.now()-3600000)) return;
    items.push({type:'meeting',id:m.id,title:m.title,time:fmtDT(m.start_at),sort:due.getTime(),overdue:due<new Date()&&due>=today,soon:due>=today&&due<tomorrow});
  });
  items.sort((a,b)=>a.sort-b.sort);
  const list=document.getElementById('todayList');
  if(!items.length){list.innerHTML='<div class="empty">🎉 暂无待处理事项</div>';return;}
  list.innerHTML=items.slice(0,15).map(i=>`
    <div class="today-item ${i.overdue?'overdue':''}" role="button" tabindex="0" onclick="gotoTarget('${i.type}','${i.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();gotoTarget('${i.type}','${i.id}');}">
      <span class="dot"></span>
      <span class="title">${escapeHtml(i.title)}</span>
      <span class="tag">${i.type==='todo'?'待办':'会议'}</span>
      <span class="time">${i.time} · ${relTime(new Date(i.sort).toISOString())}</span>
    </div>`).join('');
}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// 今日待办点击 → 页内跳转到对应待办/会议行并高亮
function gotoTarget(type,id){
  const prefix=type==='meeting'?'mtg-row-':'todo-row-';
  let el=document.getElementById(prefix+id);
  // 兜底：目标行不在当前可见列表（如被筛选隐藏），跳到对应区块顶部
  if(!el) el=document.getElementById(type==='meeting'?'sec-meetings':'sec-todos');
  if(!el) return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),3800);
}

const ROLE_LABEL={operator:'运营',service:'客服',admin:'管理员'};
const ROLE_CLASS={operator:'operator',service:'service',admin:'admin'};
function getRoleKey(role){return role==='admin'?'operator':role;} // 管理员显示运营清单
function getTodayKey(){return fmtDate(new Date());} // '2026-08-21'
function getCheckedTasks(){return state.myChecks;}
// 勾选状态本地缓存（按 用户id+日期 隔离；云端表不可用时兜底）
function localChecksKey(){const uid=state.currentUser?state.currentUser.id:'anon';return 'jzqg_rt_'+uid+'_'+getTodayKey();}
function loadLocalChecks(){try{return JSON.parse(localStorage.getItem(localChecksKey())||'{}');}catch(e){return {};}}
function saveLocalChecks(c){try{localStorage.setItem(localChecksKey(),JSON.stringify(c));}catch(e){}}

function renderRoleTasks(){
  const me=state.currentUser;
  const isAdmin=me.role==='admin';
  const isOperator=me.role==='operator';
  // 可见角色范围
  const visibleRoles=isAdmin||isOperator?['operator','service']:getRoleKey(me.role);
  // 自己的角色
  const myRole=getRoleKey(me.role);
  // 筛选任务
  const allTasks=state.roleTasks.filter(t=>visibleRoles.includes(t.role)).sort((a,b)=>a.sort-b.sort);
  const myTasks=allTasks.filter(t=>t.role===myRole);
  const othersTasks=allTasks.filter(t=>t.role!==myRole);
  const checked=getCheckedTasks();
  const el=document.getElementById('roleTaskList');
  if(!el) return;
  // 渲染自己的任务（左栏）
  const myDone=myTasks.filter(t=>checked[t.id]).length;
  const myHtml=myTasks.length?`
    <div class="roletasks-col">
      <h4>📋 我的任务 <span class="badge" style="font-size:11px;background:var(--brand-light);color:var(--brand)">${myDone}/${myTasks.length}</span></h4>
      <div class="role-task-list">
        ${myTasks.map(t=>{
          const isDone=checked[t.id];
          return `<div class="role-task-item ${isDone?'checked':''}" onclick="toggleRoleTask('${t.id}')">
            <div class="role-task-check">${isDone?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':''}</div>
            <span class="role-task-title">${escapeHtml(t.title)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`:'<div class="roletasks-col"><h4>📋 我的任务</h4><div class="empty">暂无任务</div></div>';

  // 渲染全员任务（右栏，按员工分组显示）
  let othersHtml='';
  if(othersTasks.length||isAdmin){
    // 构建员工分组数据
    const employeeMap=new Map();
    // 1. 先添加所有可见员工（按角色）
    const visibleUsers=state.users.filter(u=>visibleRoles.includes(getRoleKey(u.role)));
    visibleUsers.forEach(u=>{
      const key=u.id;
      if(!employeeMap.has(key)){
        employeeMap.set(key,{
          id:u.id,
          display_name:u.display_name,
          role:u.role,
          roleLabel:ROLE_LABEL[u.role]||u.role,
          roleClass:ROLE_CLASS[u.role]||'operator',
          tasks:[]
        });
      }
    });
    // 2. 添加有 assigned_to 的任务到对应员工
    allTasks.filter(t=>t.assigned_to).forEach(t=>{
      const emp=employeeMap.get(t.assigned_to);
      if(emp) emp.tasks.push(t);
    });
    // 3. 添加无 assigned_to 的任务到同岗位所有员工
    allTasks.filter(t=>!t.assigned_to).forEach(t=>{
      visibleUsers.filter(u=>getRoleKey(u.role)===t.role).forEach(u=>{
        const emp=employeeMap.get(u.id);
        if(emp) emp.tasks.push(t);
      });
    });
    // 4. 渲染每个员工分组
    const sortedEmps=[...employeeMap.values()].sort((a,b)=>{
      // 按角色排序：运营在前，客服在后
      const roleOrder={operator:0,service:1};
      return (roleOrder[a.role]||0)-(roleOrder[b.role]||0)||a.display_name.localeCompare(b.display_name);
    });
    othersHtml=`
      <div class="roletasks-col" style="grid-column:span 2;">
        <h4>👥 全员任务 <span class="badge" style="font-size:11px;background:#DBEAFE;color:#1E40AF">${allTasks.length}条任务 · ${sortedEmps.length}人</span></h4>
        <div class="role-task-list">
          ${sortedEmps.map(emp=>{
            const empChecks=state.empChecks[emp.id]||{};
            const empDone=emp.tasks.filter(t=>empChecks[t.id]).length;
            const empTotal=emp.tasks.length;
            const canCheck=emp.id===me.id||isAdmin;
            return `
            <div class="employee-group">
              <div class="employee-header">
                <span class="role-task-cat ${emp.roleClass}">${emp.roleLabel}</span>
                <span class="employee-name">👤 ${escapeHtml(emp.display_name)}</span>
                <span class="employee-stats">${empDone}/${empTotal} 已完成</span>
                ${isAdmin?`<span class="admin-status ${empDone===empTotal?'':'unchecked'}">${empDone===empTotal?'✓ 全部完成':'○ 未完成'}</span>`:''}
              </div>
              <div class="role-task-list" style="padding-left:12px;">
                ${emp.tasks.length?emp.tasks.map(t=>{
                  const isDone=empChecks[t.id];
                  const taskEmpId=t.assigned_to||emp.id;
                  const isMyTask=taskEmpId===me.id;
                  return `<div class="role-task-item ${isDone?'checked':''} ${isMyTask?'':'disabled'}"
                    ${canCheck&&isMyTask?`onclick="toggleRoleTask('${t.id}')"`:''}>
                    <div class="role-task-check">${isDone?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':''}</div>
                    <span class="role-task-title">${escapeHtml(t.title)}</span>
                    ${t.assigned_to?`<span class="role-task-cat ${emp.roleClass}" style="font-size:10px">指定</span>`:''}
                  </div>`;
                }).join(''):'<div style="font-size:12px;color:var(--ink-3);padding:8px 0">暂无任务</div>'}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }
  el.innerHTML=myHtml+(othersHtml||'');
  // 更新进度卡（统计我自己的任务完成度）
  const myTotal=myTasks.length;
  const done=myTasks.filter(t=>checked[t.id]).length;
  const pct=myTotal?Math.round(done/myTotal*100):0;
  document.getElementById('rtProgressWrap').innerHTML=`
    <div class="rt-progress">
      <div class="rt-label">📊 我的今日任务进度（共 ${myTotal} 条，已完成 ${done} 条）</div>
      <div class="rt-bar"><div class="rt-fill" style="width:${pct}%"></div></div>
      <div class="rt-text">${done}/${myTotal} 已完成 (${pct}%)</div>
    </div>`;
}
async function toggleRoleTask(taskId){
  const task=state.roleTasks.find(t=>t.id===taskId);
  if(!task) return;
  const checked=state.myChecks;
  const wasChecked=!!checked[taskId];
  if(wasChecked) delete checked[taskId]; else checked[taskId]=true;
  state.myChecks=checked;
  saveLocalChecks(checked); // 本地缓存（离线/云端失败兜底）
  renderRoleTasks();
  renderToday();
  // 云端同步（每人独立；表不存在或失败则静默，本地已兜底）
  if(state.checksCloud){
    try{
      if(!wasChecked){
        await req('POST','role_task_checks',{user_id:state.currentUser.id,task_id:taskId,check_date:getTodayKey()});
      }else{
        await req('DELETE','role_task_checks',`user_id=eq.${state.currentUser.id}&task_id=eq.${taskId}&check_date=eq.${getTodayKey()}`);
      }
    }catch(e){toast('云端同步失败（已保存在本地）','err');}
  }
}

function openRoleTaskForm(role){
  // 1. 先输入任务内容
  const title=prompt(`请输入新的【${ROLE_LABEL[role]||role}】固定任务内容：`);
  if(!title||!title.trim()) return;
  // 2. 询问是否指定具体员工（可选）
  const assignOptions=state.users.filter(u=>getRoleKey(u.role)===role).map(u=>`${u.display_name}(${u.username})`).join('\n') || '无';
  const assignChoice=prompt(`请输入要分配给的具体员工（留空则分配给所有${ROLE_LABEL[role]}）：\n当前${ROLE_LABEL[role]}列表：\n${assignOptions}`, '');
  // 3. 确定 assigned_to
  let assigned_to=null;
  if(assignChoice&&assignChoice.trim()){
    const targetUser=state.users.find(u=>
      u.username===assignChoice.trim()||
      u.display_name===assignChoice.trim()||
      (u.display_name+'('+u.username+')')===assignChoice.trim()
    );
    if(targetUser&&getRoleKey(targetUser.role)===role){
      assigned_to=targetUser.id;
    }else{
      toast('未找到该员工，已分配给全体'+ROLE_LABEL[role],'err');
    }
  }
  // 4. 创建任务
  const maxSort=state.roleTasks.filter(t=>t.role===role).reduce((m,t)=>Math.max(m,t.sort),0);
  req('POST','role_tasks',{role,title:title.trim(),sort:maxSort+1,assigned_to}).then(()=>{loadAll();renderAll();toast('已添加','ok');}).catch(e=>toast('添加失败：'+e.message,'err'));
}

// ============ 提醒 ============
function startReminder(){
  if(state.reminderTimer) clearInterval(state.reminderTimer);
  checkReminder();
  state.reminderTimer=setInterval(checkReminder,30000);
}
async function checkReminder(){
  if(!state.currentUser) return;
  const me=state.currentUser;
  const now=Date.now();
  const todosToRemind=[];
  state.todos.filter(t=>t.user_id===me.id&&t.status!=='done'&&t.due_at).forEach(t=>{
    const due=new Date(t.due_at).getTime();
    const mins=(due-now)/60000;
    const alreadyReminded=t.reminded_at&&new Date(t.reminded_at).getTime()>due-60000;
    if(mins<=t.remind_before_min&&mins>=-120&&!alreadyReminded){
      todosToRemind.push(t);
    }
  });
  for(const t of todosToRemind){
    await notify('⏰ 待办提醒',`${t.title}\n${fmtDT(t.due_at)}`);
    await req('PATCH','todos',`id=eq.${t.id}`,{reminded_at:new Date().toISOString(),updated_at:new Date().toISOString()});
  }
  const meetingsToRemind=[];
  state.meetings.filter(m=>m.user_id===me.id&&m.start_at).forEach(m=>{
    const start=new Date(m.start_at).getTime();
    const mins=(start-now)/60000;
    const alreadyReminded=m.reminded_at&&new Date(m.reminded_at).getTime()>start-60000;
    if(mins<=m.remind_before_min&&mins>=-30&&!alreadyReminded){
      meetingsToRemind.push(m);
    }
  });
  for(const m of meetingsToRemind){
    await notify('📅 会议提醒',`${m.title}\n${fmtDT(m.start_at)}${m.location?'\n📍 '+m.location:''}`);
    await req('PATCH','meetings',`id=eq.${m.id}`,{reminded_at:new Date().toISOString(),updated_at:new Date().toISOString()});
  }
  if(todosToRemind.length||meetingsToRemind.length){
    playDing(); // 单次提醒事件整体连响3声，避免短促漏听
    await loadAll();renderAll();
  }
}

function setSync(s){
  const el=document.getElementById('syncState');
  const txt=document.getElementById('syncText');
  if(!el) return;
  el.classList.remove('syncing','err','offline');
  if(s==='syncing'){el.classList.add('syncing');txt.textContent='同步中…';}
  else if(s==='err'){el.classList.add('err');txt.textContent='同步失败';}
  else if(s==='offline'){el.classList.add('offline');txt.textContent='离线';}
  else {txt.textContent='已同步';}
}
let _autoSyncTimer=null;
async function syncPull(silent){
  if(!state.currentUser) return;
  setSync('syncing');
  try{
    await loadAll();
    renderAll();
    setSync('ok');
    if(!silent) toast('已同步到云端 ✓','ok');
  }catch(e){
    setSync('err');
    if(!silent) toast('同步失败：'+(e&&e.message?e.message:e),'err');
    console.error('[同步失败]',e);
  }
}
function manualSync(){return syncPull(false);}
function startAutoSync(){
  if(_autoSyncTimer) clearInterval(_autoSyncTimer);
  _autoSyncTimer=setInterval(()=>{syncPull(true);},30000);
}

// ============ 弹窗 ============
function openModal(title,html,onSave){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=html;
  const btn=document.getElementById('modalSaveBtn');
  const newBtn=btn.cloneNode(true);btn.parentNode.replaceChild(newBtn,btn);
  newBtn.addEventListener('click',async()=>{newBtn.disabled=true;try{await onSave();}catch(e){toast('操作失败：'+(e&&e.message?e.message:e),'err');console.error('[表单保存失败]',e);}finally{newBtn.disabled=false;}});
  document.getElementById('formModal').classList.add('show');
}
function closeFormModal(){document.getElementById('formModal').classList.remove('show');}
document.getElementById('formModal').addEventListener('click',e=>{if(e.target.id==='formModal') closeFormModal();});

// ============ 事件 ============
document.getElementById('btnLogin').addEventListener('click',doLogin);
document.getElementById('loginPwd').addEventListener('keypress',e=>{if(e.key==='Enter') doLogin();});
document.getElementById('btnLogout').addEventListener('click',doLogout);
document.getElementById('btnSync').addEventListener('click',manualSync);
document.getElementById('btnAdmin').addEventListener('click',()=>document.getElementById('sec-admin').scrollIntoView({behavior:'smooth'}));
document.getElementById('btnProfile').addEventListener('click',()=>document.getElementById('sec-profile').scrollIntoView({behavior:'smooth'}));
// 移动端底部锚点导航
document.querySelectorAll('.bottomtab .bnav').forEach(el=>{
  el.addEventListener('click',()=>{
    const a=el.dataset.anchor;
    const target=document.getElementById(a);
    if(target) target.scrollIntoView({behavior:'smooth'});
  });
});
// 滚动高亮底部导航
window.addEventListener('scroll',()=>{
  const secs=['sec-today','sec-links','sec-todos','sec-meetings','sec-profile'];
  let active='sec-today';
  for(const id of secs){
    const el=document.getElementById(id);
    if(el&&el.getBoundingClientRect().top<=120) active=id;
  }
  document.querySelectorAll('.bottomtab .bnav').forEach(b=>b.classList.toggle('active',b.dataset.anchor===active));
},{passive:true});

// ============ 启动 ============
(async function init(){
  try{
    await ensureAdmin();
    await autoLogin();
  }catch(e){console.error(e);}
})();
</script>
